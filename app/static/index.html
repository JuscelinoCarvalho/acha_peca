<!doctype html>

        <circle cx="24" cy="24" r="14.6" fill="none" stroke="rgba(10,16,24,.35)" stroke-width="1"/>

        <circle cx="24" cy="24" r="7" fill="url(#gLens)"/>
        <circle cx="24" cy="24" r="7" fill="none" stroke="url(#gChrome)" stroke-width="2"/>

      <div>
