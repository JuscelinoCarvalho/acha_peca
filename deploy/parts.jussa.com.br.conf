<VirtualHost *:80>
    ServerName parts.jussa.com.br
    DocumentRoot /var/www/html/parts-acme

    # Desafio ACME (Let's Encrypt) via webroot, sem passar pelo proxy
    Alias /.well-known/acme-challenge/ /var/www/html/parts-acme/.well-known/acme-challenge/
    <Directory /var/www/html/parts-acme/.well-known/acme-challenge/>
        Require all granted
    </Directory>
    ProxyPass /.well-known/acme-challenge/ !

    # Manuais de fábrica: servidos direto do disco pelo Apache (bypass do uvicorn)
    Alias /manuais /home/jussa/FileShare/development/acha_peca/catalog_pdf/jdmfsm/www.jdmfsm.info/Auto
    <Directory /home/jussa/FileShare/development/acha_peca/catalog_pdf/jdmfsm/www.jdmfsm.info/Auto>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
    </Directory>
    ProxyPass /manuais !

    # Reverse proxy do acha peça: um único uvicorn (API + SPA/PWA) na 8077
    ProxyPreserveHost On
    ProxyPass        /  http://127.0.0.1:8077/
    ProxyPassReverse /  http://127.0.0.1:8077/

    # Nunca cachear o HTML (casca do SPA); assets/estáticos seguem cacheáveis
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache, no-store, must-revalidate" "expr=%{CONTENT_TYPE} =~ m#text/html#"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/parts_error.log
    CustomLog ${APACHE_LOG_DIR}/parts_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =parts.jussa.com.br
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
